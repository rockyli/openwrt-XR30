name: RAX3000M - Build official baseline

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rax3000m-baseline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'rockyli/openwrt-XR30' && github.ref == 'refs/heads/xr30-25.12'
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      BASE_COMMIT: f0a60eee2fe051741c643ea6118718aae1ef17fb
      BUILD_DIR: ${{ github.workspace }}/openwrt
      OUTPUT_DIR: ${{ github.workspace }}/baseline-output
    steps:
      - name: Prepare build host
        shell: bash
        run: |
          set -euo pipefail
          # These are disposable hosted-runner SDKs, not project files.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3 python3-setuptools \
            python3-pyelftools rsync swig unzip zlib1g-dev file wget curl \
            ca-certificates xz-utils zstd time
          available_kb=$(df -Pk "$GITHUB_WORKSPACE" | awk 'NR == 2 {print $4}')
          if [ "$available_kb" -lt 26214400 ]; then
            echo '::error::At least 25 GiB free space is required for this source build.'
            exit 1
          fi
          df -h "$GITHUB_WORKSPACE"

      - name: Fetch fixed official source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$BUILD_DIR" "$OUTPUT_DIR"
          git init "$BUILD_DIR"
          git -C "$BUILD_DIR" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$BUILD_DIR" fetch --depth=1 --no-tags origin "$BASE_COMMIT"
          git -C "$BUILD_DIR" checkout --detach FETCH_HEAD
          test "$(git -C "$BUILD_DIR" rev-parse HEAD)" = "$BASE_COMMIT"
          # A shallow checkout cannot infer the release tag; use the verified
          # SOURCE_DATE_EPOCH and official revision string explicitly below.
          printf '%s\n' "$BASE_COMMIT" > "$OUTPUT_DIR/openwrt-commit.txt"
          printf '%s\n' "$GITHUB_SHA" > "$OUTPUT_DIR/workflow-commit.txt"
          printf 'SOURCE_DATE_EPOCH=%s\n' "$(git -C "$BUILD_DIR" log -1 --format=%ct)" >> "$GITHUB_ENV"

      - name: Install pinned feeds
        shell: bash
        working-directory: ${{ env.BUILD_DIR }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path
          lines = [x for x in Path('feeds.conf.default').read_text().splitlines() if x and not x.startswith('#')]
          if not lines or not all(re.fullmatch(r'src-git\s+\w+\s+https://\S+\^[0-9a-f]{40}', x) for x in lines):
              raise SystemExit('Feed revisions must be fixed before building')
          PY
          cp feeds.conf.default "$OUTPUT_DIR/feeds.conf.default"
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          while read -r kind name source; do
            case "$kind" in src-git) ;; *) continue ;; esac
            expected=${source##*^}
            actual=$(git -C "feeds/$name" rev-parse HEAD)
            test "$actual" = "$expected"
            printf '%s %s\n' "$name" "$actual" >> "$OUTPUT_DIR/feed-commits.txt"
          done < feeds.conf.default

      - name: Configure RAX3000M with LuCI
        shell: bash
        working-directory: ${{ env.BUILD_DIR }}
        run: |
          set -euo pipefail
          cat > .config <<'EOF'
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_filogic=y
          CONFIG_TARGET_mediatek_filogic_DEVICE_cmcc_rax3000m=y
          CONFIG_TARGET_ROOTFS_INITRAMFS=y
          CONFIG_TARGET_ROOTFS_SQUASHFS=y
          CONFIG_TARGET_ROOTFS_PARTSIZE=448
          CONFIG_PACKAGE_luci=y
          CONFIG_VERSIONOPT=y
          CONFIG_VERSION_NUMBER="25.12.5"
          CONFIG_VERSION_CODE="r33051-f5dae5ece4"
          # CONFIG_IB is not set
          # CONFIG_SDK is not set
          EOF
          cp .config "$OUTPUT_DIR/config.seed"
          make defconfig
          grep -qx 'CONFIG_TARGET_mediatek_filogic_DEVICE_cmcc_rax3000m=y' .config
          grep -qx 'CONFIG_PACKAGE_luci=y' .config
          test "$(grep -c '^CONFIG_TARGET_.*_DEVICE_.*=y$' .config)" -eq 1
          cp .config "$OUTPUT_DIR/config.full"
          ./scripts/diffconfig.sh > "$OUTPUT_DIR/config.diff"
          git diff --exit-code
          test ! -d files

      - name: Download sources
        shell: bash
        working-directory: ${{ env.BUILD_DIR }}
        run: |
          set -euo pipefail
          make download -j8 2>&1 | tee "$OUTPUT_DIR/download.log"

      - name: Compile firmware
        shell: bash
        working-directory: ${{ env.BUILD_DIR }}
        run: |
          set -euo pipefail
          jobs=$(nproc)
          if [ "$jobs" -gt 4 ]; then jobs=4; fi
          make -j"$jobs" V=s 2>&1 | tee "$OUTPUT_DIR/build.log"

      - name: Preserve images before validation
        shell: bash
        working-directory: ${{ env.BUILD_DIR }}
        run: |
          set -euo pipefail
          target_dir=bin/targets/mediatek/filogic
          printf 'Image validation is incomplete. These files are for diagnosis, not approved for flashing.\n' > "$OUTPUT_DIR/VALIDATION_PENDING.txt"
          shopt -s nullglob
          for file in "$target_dir"/openwrt*-mediatek-filogic-cmcc_rax3000m-*.itb \
                      "$target_dir"/openwrt*-mediatek-filogic-cmcc_rax3000m.manifest \
                      "$target_dir"/profiles.json; do
            [ -f "$file" ] || continue
            cp "$file" "$OUTPUT_DIR/"
          done
          ls -lh "$target_dir" > "$OUTPUT_DIR/target-files.txt"

      - name: Validate and collect artifacts
        shell: bash
        working-directory: ${{ env.BUILD_DIR }}
        run: |
          set -euo pipefail
          target_dir=bin/targets/mediatek/filogic
          # VERSION_NUMBER does not imply CONFIG_VERSION_FILENAMES=y.
          # Accept exactly one known filename for each image type.
          prefixes=(openwrt-mediatek-filogic-cmcc_rax3000m openwrt-25.12.5-mediatek-filogic-cmcc_rax3000m)
          for suffix in squashfs-sysupgrade.itb initramfs-recovery.itb; do
            candidates=()
            for prefix in "${prefixes[@]}"; do
              candidate="$target_dir/$prefix-$suffix"
              if [ -s "$candidate" ]; then candidates+=("$candidate"); fi
            done
            if [ "${#candidates[@]}" -ne 1 ]; then
              echo "::error::Expected exactly one nonempty RAX3000M $suffix image; found ${#candidates[@]}."
              ls -lh "$target_dir"
              exit 1
            fi
            image=${candidates[0]}
            printf 'Validating %s\n' "$image"
            staging_dir/host/bin/mkimage -l "$image" > "$OUTPUT_DIR/$suffix.structure.txt"
            if ! grep -q 'mt7981b-cmcc-rax3000m-emmc' "$OUTPUT_DIR/$suffix.structure.txt"; then
              echo "::error::RAX3000M eMMC overlay is missing from $image."
              exit 1
            fi
          done
          for file in "$target_dir"/*.manifest "$target_dir"/profiles.json; do
            test -f "$file"
            cp "$file" "$OUTPUT_DIR/"
          done
          # Preserve matching package outputs without uploading signing keys.
          # Do not use an official kmod feed unless ABI compatibility is verified.
          tar -czf "$OUTPUT_DIR/matching-packages.tar.gz" \
            bin/packages "$target_dir/packages"
          cat > "$OUTPUT_DIR/BASELINE-NOTES.txt" <<'EOF'
          Community source build of official OpenWrt v25.12.5 for CMCC RAX3000M.
          Official device support, LuCI, 448 MiB production partition setting.
          No XR30 profile, private device data, passwords or custom first-boot scripts.
          This is not an official OpenWrt release binary or a byte-identical rebuild.
          Build success and FIT inspection do not prove hardware compatibility.
          Preserve config and feed revisions with the images.
          Private signing keys are intentionally not included in these artifacts.
          Further package-feed/signing setup may be required to install archived packages.
          Do not reflash BL2, U-Boot or GPT for an ordinary system upgrade.
          EOF
          cd "$OUTPUT_DIR"
          sha256sum ./*.itb matching-packages.tar.gz > SHA256SUMS
          printf 'Both FIT images passed structure inspection. Hardware testing remains required.\n' > VALIDATION_OK.txt
          rm VALIDATION_PENDING.txt
          printf '## RAX3000M baseline build completed\n\n' >> "$GITHUB_STEP_SUMMARY"
          printf 'Source: `%s`\n\nDownload the artifact below; hardware testing is still required.\n' "$BASE_COMMIT" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build outputs and diagnostic logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rax3000m-25.12.5-baseline-${{ github.run_number }}-${{ github.run_attempt }}
          path: ${{ env.OUTPUT_DIR }}/
          if-no-files-found: warn
          retention-days: 14
          compression-level: 6
