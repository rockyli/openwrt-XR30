name: XR30 - Build development firmware

on:
  workflow_dispatch:
  push:
    tags:
      - 'xr30-ci-*'

permissions:
  contents: read

concurrency:
  group: xr30-development-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'rockyli/openwrt-XR30' && github.ref != 'refs/heads/main' && github.ref != 'refs/heads/openwrt-25.12'
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      SOURCE_COMMIT: ${{ github.sha }}
      BUILD_DIR: ${{ github.workspace }}/openwrt
      OUTPUT_DIR: ${{ github.workspace }}/xr30-output
    steps:
      - name: Prepare build host
        shell: bash
        run: |
          set -euo pipefail
          # These are disposable hosted-runner SDKs, not project files.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3 python3-setuptools \
            python3-pyelftools rsync swig unzip zlib1g-dev file wget curl \
            ca-certificates xz-utils zstd time device-tree-compiler
          available_kb=$(df -Pk "$GITHUB_WORKSPACE" | awk 'NR == 2 {print $4}')
          if [ "$available_kb" -lt 26214400 ]; then
            echo '::error::At least 25 GiB free space is required for this source build.'
            exit 1
          fi
          df -h "$GITHUB_WORKSPACE"

      - name: Fetch exact XR30 source commit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$BUILD_DIR" "$OUTPUT_DIR"
          git init "$BUILD_DIR"
          git -C "$BUILD_DIR" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$BUILD_DIR" fetch --depth=1 --no-tags origin "$SOURCE_COMMIT"
          git -C "$BUILD_DIR" checkout --detach FETCH_HEAD
          test "$(git -C "$BUILD_DIR" rev-parse HEAD)" = "$SOURCE_COMMIT"
          printf '%s\n' "$SOURCE_COMMIT" > "$OUTPUT_DIR/openwrt-commit.txt"
          printf '%s\n' "$GITHUB_SHA" > "$OUTPUT_DIR/workflow-commit.txt"
          epoch=$(python3 -c 'import json, os; from pathlib import Path; print(json.loads((Path(os.environ["BUILD_DIR"]) / "config/xr30-official/lock.json").read_text())["source_date_epoch"])')
          printf 'SOURCE_DATE_EPOCH=%s\n' "$epoch" >> "$GITHUB_ENV"
          baseline=$(python3 -c 'import json, os; from pathlib import Path; print(json.loads((Path(os.environ["BUILD_DIR"]) / "config/xr30-official/lock.json").read_text())["source_commit"])')
          git -C "$BUILD_DIR" fetch --depth=1 --no-tags origin "$baseline"
          # Device descriptions and image recipes may differ; kernel/toolchain
          # sources and build rules must remain identical to this release.
          git -C "$BUILD_DIR" diff --exit-code "$baseline" HEAD -- \
            include tools toolchain scripts 'config/Config-*' package/kernel \
            target/linux/generic target/linux/mediatek/Makefile \
            target/linux/mediatek/filogic 'target/linux/mediatek/patches-*' \
            'target/linux/mediatek/files*' target/linux/mediatek/dts \
            ':!target/linux/mediatek/dts/mt7981b-cmcc-xr30.dts'

      - name: Check XR30 image recipes
        shell: bash
        working-directory: ${{ env.BUILD_DIR }}
        run: |
          python3 .github/workflows/scripts/test-xr30-image-recipes.py
          python3 .github/workflows/scripts/test-xr30-official-abi.py

      - name: Install pinned feeds
        shell: bash
        working-directory: ${{ env.BUILD_DIR }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path
          lines = [x for x in Path('feeds.conf.default').read_text().splitlines() if x and not x.startswith('#')]
          if not lines or not all(re.fullmatch(r'src-git\s+\w+\s+https://\S+\^[0-9a-f]{40}', x) for x in lines):
              raise SystemExit('Feed revisions must be fixed before building')
          PY
          cp feeds.conf.default "$OUTPUT_DIR/feeds.conf.default"
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          while read -r kind name source; do
            case "$kind" in src-git) ;; *) continue ;; esac
            expected=${source##*^}
            actual=$(git -C "feeds/$name" rev-parse HEAD)
            test "$actual" = "$expected"
            printf '%s %s\n' "$name" "$actual" >> "$OUTPUT_DIR/feed-commits.txt"
          done < feeds.conf.default

      - name: Configure XR30 with LuCI
        shell: bash
        working-directory: ${{ env.BUILD_DIR }}
        run: |
          set -euo pipefail
          python3 .github/workflows/scripts/xr30-official-abi.py seed
          cp -r config/xr30-official "$OUTPUT_DIR/official-baseline"
          printf 'CONFIG_VERSION_CODE="xr30-%s"\n' "${SOURCE_COMMIT:0:12}" >> .config
          cp .config "$OUTPUT_DIR/config.seed"
          make defconfig 2>&1 | tee "$OUTPUT_DIR/defconfig.log"
          # Preserve the generated configuration even when validation fails.
          cp .config "$OUTPUT_DIR/config.full"
          ./scripts/diffconfig.sh > "$OUTPUT_DIR/config.diff"
          python3 .github/workflows/scripts/xr30-official-abi.py config
          git diff --exit-code
          test ! -d files

      - name: Download sources
        shell: bash
        working-directory: ${{ env.BUILD_DIR }}
        run: |
          set -euo pipefail
          make download -j8 2>&1 | tee "$OUTPUT_DIR/download.log"

      - name: Build toolchain and check official kernel ABI
        shell: bash
        working-directory: ${{ env.BUILD_DIR }}
        run: |
          set -euo pipefail
          jobs=$(nproc)
          if [ "$jobs" -gt 4 ]; then jobs=4; fi
          make -j"$jobs" tools/install V=s 2>&1 | tee "$OUTPUT_DIR/tools.log"
          make -j"$jobs" toolchain/install V=s 2>&1 | tee "$OUTPUT_DIR/toolchain.log"
          # The DTB target configures the real kernel before packaging any image.
          make -j"$jobs" target/linux/dtb V=s 2>&1 | tee "$OUTPUT_DIR/kernel-configure.log"
          python3 .github/workflows/scripts/xr30-official-abi.py kernel --output "$OUTPUT_DIR"

      - name: Compile firmware
        shell: bash
        working-directory: ${{ env.BUILD_DIR }}
        run: |
          set -euo pipefail
          jobs=$(nproc)
          if [ "$jobs" -gt 4 ]; then jobs=4; fi
          make -j"$jobs" V=s 2>&1 | tee "$OUTPUT_DIR/build.log"

      - name: Preserve images before validation
        shell: bash
        working-directory: ${{ env.BUILD_DIR }}
        run: |
          set -euo pipefail
          target_dir=bin/targets/mediatek/filogic
          printf 'Image validation is incomplete. These files are for diagnosis, not approved for flashing.\n' > "$OUTPUT_DIR/VALIDATION_PENDING.txt"
          shopt -s nullglob
          for file in "$target_dir"/openwrt*-mediatek-filogic-cmcc_xr30-*.itb \
                      "$target_dir"/openwrt*-mediatek-filogic-cmcc_xr30.manifest \
                      "$target_dir"/profiles.json; do
            [ -f "$file" ] || continue
            cp "$file" "$OUTPUT_DIR/"
          done
          ls -lh "$target_dir" > "$OUTPUT_DIR/target-files.txt"

      - name: Validate and collect artifacts
        shell: bash
        working-directory: ${{ env.BUILD_DIR }}
        run: |
          set -euo pipefail
          target_dir=bin/targets/mediatek/filogic
          # include/image.mk normalizes the version to lowercase in filenames.
          prefixes=(openwrt-25.12.5-xr30-mediatek-filogic-cmcc_xr30)
          for suffix in squashfs-sysupgrade.itb initramfs-recovery.itb; do
            candidates=()
            for prefix in "${prefixes[@]}"; do
              candidate="$target_dir/$prefix-$suffix"
              if [ -s "$candidate" ]; then candidates+=("$candidate"); fi
            done
            if [ "${#candidates[@]}" -ne 1 ]; then
              echo "::error::Expected exactly one nonempty XR30 $suffix image; found ${#candidates[@]}."
              ls -lh "$target_dir"
              exit 1
            fi
            image=${candidates[0]}
            case "$suffix" in
              squashfs-sysupgrade.itb) max_bytes=469762048 ;;
              initramfs-recovery.itb) max_bytes=33554432 ;;
            esac
            test "$(stat -c %s "$image")" -le "$max_bytes"
            printf 'Validating %s\n' "$image"
            staging_dir/host/bin/mkimage -l "$image" > "$OUTPUT_DIR/$suffix.structure.txt"
            python3 .github/workflows/scripts/validate-xr30-fit.py "$image"
            if [ "$suffix" = squashfs-sysupgrade.itb ]; then
              staging_dir/host/bin/fwtool -i "$OUTPUT_DIR/sysupgrade-metadata.json" "$image"
            fi
          done
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          metadata = json.loads((Path(os.environ['OUTPUT_DIR']) / 'sysupgrade-metadata.json').read_text())
          if metadata.get('supported_devices') != ['cmcc,rax3000m']:
              raise SystemExit('Unexpected sysupgrade compatibility metadata')
          PY
          for file in "$target_dir"/*.manifest "$target_dir"/profiles.json; do
            test -f "$file"
            cp "$file" "$OUTPUT_DIR/"
          done
          # Multi-profile builds have a common manifest. Inspect the actual
          # single device rootfs so device-specific packages are also covered.
          shopt -s nullglob
          rootfs=(build_dir/target-*/linux-mediatek_filogic/target-dir-*)
          test "${#rootfs[@]}" -eq 1
          staging_dir/host/bin/apk --root "${rootfs[0]}" --arch aarch64_cortex-a53 \
            --no-logfile --no-network --repositories-file /dev/null \
            list --quiet --manifest | sort | sed 's/ / - /' > "$OUTPUT_DIR/xr30-installed-packages.manifest"
          python3 .github/workflows/scripts/xr30-official-abi.py kernel --output "$OUTPUT_DIR"
          python3 .github/workflows/scripts/xr30-official-abi.py image --output "$OUTPUT_DIR"
          # Test signed official repositories against an isolated copy, leaving
          # the firmware rootfs and installed package selection unchanged.
          check_root=$(mktemp -d "$RUNNER_TEMP/xr30-apk-check.XXXXXX")
          trap 'rm -rf "$check_root"' EXIT
          cp -a "${rootfs[0]}/." "$check_root/"
          apk=("$PWD/staging_dir/host/bin/apk" --root "$check_root" \
            --arch aarch64_cortex-a53 --keys-dir "$check_root/etc/apk/keys" \
            --no-logfile)
          "${apk[@]}" update 2>&1 | tee "$OUTPUT_DIR/official-apk-update.log"
          # APK 3 exposes --no-scripts only for commit commands such as add;
          # update accepts global options only. Keep signature checks enabled.
          "${apk[@]}" add --simulate --no-scripts kmod-tun kmod-inet-diag kmod-nft-tproxy \
            tailscale luci-app-tailscale-community 2>&1 | tee "$OUTPUT_DIR/official-apk-install-simulation.log"
          # Preserve matching package outputs without uploading signing keys.
          # Do not use an official kmod feed unless ABI compatibility is verified.
          tar -czf "$OUTPUT_DIR/matching-packages.tar.gz" \
            bin/packages "$target_dir/packages"
          cat > "$OUTPUT_DIR/XR30-NOTES.txt" <<'EOF'
          XR30 personal firmware candidate based on OpenWrt 25.12.5.
          Runtime model is XR30; board compatibility remains cmcc,rax3000m.
          Existing RAX3000M FIT overlay names and partition handling are retained.
          This build uses the exact triggering repository commit, not the fixed baseline.
          LuCI and a 448 MiB production partition setting are selected.
          Kernel configuration is derived from the pinned official release; ABI and kmod feed checks passed.
          Optional TUN/INET diagnostics/TPROXY modules are compiled but not preinstalled.
          Signed official feeds passed a simulated Tailscale and optional module installation.
          Actual module loading and application operation still require hardware validation.
          Tailscale, OpenClash and their LuCI apps are installed separately after flashing.
          Fresh defaults: LAN/failsafe 192.168.10.1/24; LAN DHCP pool .100-.249, 12h leases.
          Preserving settings during sysupgrade preserves the old LAN/DHCP configuration.
          Build and FIT checks do not establish hardware compatibility.
          Confirm the target layout, recovery path, checksum and sysupgrade -T before flashing.
          Keep configs, revision records and matching packages with these images.
          These are custom XR30 binaries targeting the exact official 25.12.5 kernel module ABI.
          Official feeds use installed OpenWrt signing keys. Locally built package archives need separate trust setup.
          LEDs: red GPIO35 for boot/failsafe; white GPIO34 for running/upgrade; both active low.
          LED on/off and RESET events were tested on hardware using the previous official firmware.
          Updated-image status indication and actual factory reset still need testing; Mesh is deferred.
          No new bootloader or GPT artifacts are included.
          EOF
          cd "$OUTPUT_DIR"
          sha256sum ./*.itb matching-packages.tar.gz > SHA256SUMS
          printf 'FIT, kernel ABI, module feed and signed APK dependency checks passed. Hardware testing remains required.\n' > VALIDATION_OK.txt
          rm VALIDATION_PENDING.txt
          printf '## XR30 development build completed\n\n' >> "$GITHUB_STEP_SUMMARY"
          printf 'Source: `%s`\n\nDownload the artifact below; hardware testing is still required.\n' "$SOURCE_COMMIT" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build outputs and diagnostic logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: xr30-25.12.5-development-${{ github.run_number }}-${{ github.run_attempt }}
          path: ${{ env.OUTPUT_DIR }}/
          if-no-files-found: warn
          retention-days: 14
          compression-level: 6
